<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Photo Search</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    input[type=text] { padding: 6px; width: 260px; }
    button { padding: 6px 12px; }
    #results { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    figure { margin: 0; width: 200px; }
    figcaption { font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <h1>AI Photo Search</h1>

  <section>
    <h2>Search</h2>
    <input type="text" id="searchBox" placeholder="e.g. show me photos with cats and Sam">
    <button onclick="search()">Search</button>
    <div id="results"></div>
  </section>

  <section>
    <h2>Upload</h2>
    <input type="file" id="fileInput" accept="image/png,image/jpeg">
    <input type="text" id="customLabels" placeholder="Custom labels, e.g. Sam, Sally">
    <button onclick="upload()">Upload</button>
  </section>

  <script src="lib/axios/dist/axios.standalone.js"></script>
  <script src="lib/CryptoJS/rollups/hmac-sha256.js"></script>
  <script src="lib/CryptoJS/rollups/sha256.js"></script>
  <script src="lib/CryptoJS/components/hmac.js"></script>
  <script src="lib/CryptoJS/components/enc-base64.js"></script>
  <script src="lib/url-template/url-template.js"></script>
  <script src="lib/apiGatewayCore/sigV4Client.js"></script>
  <script src="lib/apiGatewayCore/apiGatewayClient.js"></script>
  <script src="lib/apiGatewayCore/simpleHttpClient.js"></script>
  <script src="lib/apiGatewayCore/utils.js"></script>
  <script src="apigClient.js"></script>
  <script src="app.js"></script>
</body>
</html>
